name: Release to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.3.1, v1.0.0, etc.
  workflow_dispatch:  # Allows manual triggering from GitHub Actions UI
    inputs:
      version:
        description: 'Version to release (e.g., 0.3.1 or v0.3.1)'
        required: true
        type: string
      auto_update_version:
        description: 'Automatically update version in __init__.py (skip validation)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # For creating GitHub releases
  id-token: write  # For trusted publishing to PyPI

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          fi
          # Strip 'v' prefix if present (to handle both v0.3.1 and 0.3.1)
          TAG_VERSION=${TAG_VERSION#v}
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $TAG_VERSION"

      - name: Extract version from __init__.py
        id: get_code_version
        run: |
          CODE_VERSION=$(grep -E "__version__ = ['\"]([0-9.]+)['\"]" akeyless_cloud_id/__init__.py | sed -E "s/__version__ = ['\"]([0-9.]+)['\"]/\1/")
          echo "code_version=$CODE_VERSION" >> $GITHUB_OUTPUT
          echo "Code version: $CODE_VERSION"

      - name: Auto-update version in __init__.py
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auto_update_version == 'true'
        run: |
          TARGET_VERSION="${{ steps.get_version.outputs.tag_version }}"
          echo "Auto-updating version to $TARGET_VERSION"
          sed -i "s/__version__ = ['\"][0-9.]*['\"]/__version__ = \"$TARGET_VERSION\"/" akeyless_cloud_id/__init__.py
          
          # Verify the change
          NEW_VERSION=$(grep -E "__version__ = ['\"]([0-9.]+)['\"]" akeyless_cloud_id/__init__.py | sed -E "s/__version__ = ['\"]([0-9.]+)['\"]/\1/")
          echo "Updated version to: $NEW_VERSION"
          
          # Commit and push the change
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add akeyless_cloud_id/__init__.py
          git commit -m "Bump version to $TARGET_VERSION"
          git push

      - name: Validate versions match
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.auto_update_version != 'true')
        run: |
          if [ "${{ steps.get_version.outputs.tag_version }}" != "${{ steps.get_code_version.outputs.code_version }}" ]; then
            echo "Error: Tag version (${{ steps.get_version.outputs.tag_version }}) does not match code version (${{ steps.get_code_version.outputs.code_version }})"
            exit 1
          fi
          echo "Version validation successful: ${{ steps.get_version.outputs.tag_version }}"

  build:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Build distribution packages
        run: |
          python -m build
          # Also build using setup.py for backward compatibility
          python setup.py sdist bdist_wheel

      - name: Validate built artifacts
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 5

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  create-github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Extract version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          # Strip 'v' prefix if present (to handle both v0.3.1 and 0.3.1)
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
