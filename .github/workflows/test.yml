name: "Tests"

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with all extras + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[aws,gcp,azure]" pytest

      - name: Run tests
        # Live cloud tests are credentials-gated and skip automatically here,
        # since no cloud secrets are available in CI.
        run: pytest -v
